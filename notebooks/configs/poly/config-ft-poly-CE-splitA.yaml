## PolyReactivity dataset FT-CE fine-tune
data_dir: "data/poly"
log_dir: "output/poly"
target_column: "label"
seq_col: "full_seq"
train_file: "vhh_splitA_novelty_train.csv"
val_file: "vhh_splitA_novelty_val.csv"
test_file: "vhh_splitA_novelty_test.csv"

plms: [ 'saprot-seq-pdb', 'esm.t33-650m' ]

# CE objective
loss_weights: [ 1.0, 0.0, 0.0 ]
update_feat: True
ft: 'mlp'

entropies: [ 'Shannon', 'Shannon', 'Alpha' ]
prior_type: 'model'
prior_update: [ 1, 10, 20, 30, 50, 100, 200, 300, 500 ]

alphas: [ 1.0, 1.0, 2.0 ]

# PLM paths
local_saprot_dir_af2: "models/SaProt_650M_AF2"
local_saprot_dir_pdb: "models/SaProt_650M_PDB"
chunk_size: 100

# Minibatch adaptation
batch_threshold: 50000
batch_size: 4096
