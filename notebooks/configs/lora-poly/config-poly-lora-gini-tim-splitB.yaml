## PolyReactivity dataset — LoRA GINI-TIM
mode: lora_tim

data_dir: "data/poly"
log_dir: "output/poly"
target_column: "label"
seq_col: "full_seq"
train_file: "vhh_splitB_prevalence_train.csv"
val_file: "vhh_splitB_prevalence_val.csv"
test_file: "vhh_splitB_prevalence_test.csv"

plms: [ 'saprot-seq-pdb', 'esm.t33-650m' ]

# TIM objective
loss_weights: [ 1.0, 0.5, 0.1 ]
update_feat: False
ft: 'mlp'
warmup_iter: 200

entropies: [ 'Shannon', 'Shannon', 'Alpha' ]
prior_type: 'model'
prior_update: [ 1, 10, 20, 30, 50, 100, 200, 300, 500 ]

alphas: [ 1.0, 1.0, 2.0 ]

# PLM paths
local_saprot_dir_af2: "models/SaProt_650M_AF2"
local_saprot_dir_pdb: "models/SaProt_650M_PDB"
chunk_size: 100

# Minibatch adaptation (Stage 2)
batch_threshold: 50000
batch_size: 4096
